</div>

<script>
(function () {
  // Tonight's path: one Psalm per night of the stay.
  // Each passage has a full and (where it reads well) a shorter form, and a short and a fuller prayer.
  // Night Watch picks between them from the check-in.
  var NIGHTS = [
    { ref: "Psalm 121:1–4", lead: "A song for people on a hard road. Its writer was awake too.",
      text: "I lift up my eyes to the mountains— where does my help come from? My help comes from the LORD, the Maker of heaven and earth. He will not let your foot slip— he who watches over you will not slumber; indeed, he who watches over Israel will neither slumber nor sleep.",
      shortRef: "Psalm 121:1–2",
      shortText: "I lift up my eyes to the mountains— where does my help come from? My help comes from the LORD, the Maker of heaven and earth.",
      prayer: { short: ["Lord, my help comes from you.", "Watch over us tonight.", "Amen."],
                full: ["Lord, I'm lifting my eyes to you tonight.", "My help comes from you.", "You don't sleep, so I don't have to keep watch alone.", "Watch over the one I love.", "Watch over me.", "Amen."] },
      rest: "You're not keeping watch alone." },
    { ref: "Psalm 4:8", lead: "Someone long ago wrote this as a night prayer.",
      text: "In peace I will lie down and sleep, for you alone, LORD, make me dwell in safety.",
      prayer: { short: ["Lord, give me peace.", "I give you this night.", "Amen."],
                full: ["Lord, give me enough peace to lie down.", "You keep us safe. Not me.", "I give you this night.", "Amen."] },
      rest: "You can let God hold the night." },
    { ref: "Psalm 130:5–6", lead: "The writer compares waiting to a night guard watching for morning.",
      text: "I wait for the LORD, my whole being waits, and in his word I put my hope. I wait for the Lord more than watchmen wait for the morning, more than watchmen wait for the morning.",
      shortRef: "Psalm 130:5",
      shortText: "I wait for the LORD, my whole being waits, and in his word I put my hope.",
      prayer: { short: ["Lord, I'm waiting.", "I put my hope in you.", "Amen."],
                full: ["Lord, I'm waiting.", "I don't know what the morning will bring.", "Help me put my hope in your word while I wait.", "Amen."] },
      rest: "Morning will come. You can wait for it resting." }
  ];
  var MOMENTS = [
    { label: "My mind won't stop worrying", ref: "Psalm 94:19", lead: "A Psalm writer was anxious too, and said so.",
      text: "When anxiety was great within me, your consolation brought me joy.",
      prayer: { short: ["Lord, my mind won't stop.", "Comfort me.", "Amen."],
                full: ["Lord, my mind won't stop racing.", "You see every worry I'm carrying.", "Let your comfort be bigger than my anxiety tonight.", "Amen."] },
      rest: "You can set the worries down for now. God is holding them." },
    { label: "I'm afraid of what's next", ref: "Isaiah 41:10", lead: "These words were first spoken to people who were afraid.",
      text: "So do not fear, for I am with you; do not be dismayed, for I am your God. I will strengthen you and help you; I will uphold you with my righteous right hand.",
      shortRef: "Isaiah 41:10a",
      shortText: "So do not fear, for I am with you; do not be dismayed, for I am your God.",
      prayer: { short: ["God, I'm afraid.", "Be with me.", "Amen."],
                full: ["God, I'm afraid.", "You said you are with me.", "Strengthen me. Uphold us.", "Amen."] },
      rest: "You're not facing this alone." },
    { label: "I'm waiting for news", ref: "Psalm 46:1", lead: "A short line to hold onto.",
      text: "God is our refuge and strength, an ever-present help in trouble.",
      prayer: { short: ["God, be my refuge tonight.", "Amen."],
                full: ["God, be my refuge tonight.", "Be ever-present here, in this room, in this trouble.", "Amen."] },
      rest: "God is present in this room." },
    { label: "I'm worn out", ref: "Matthew 11:28–30", lead: "Jesus said this to people who were exhausted.",
      text: "Come to me, all you who are weary and burdened, and I will give you rest. Take my yoke upon you and learn from me, for I am gentle and humble in heart, and you will find rest for your souls. For my yoke is easy and my burden is light.",
      shortRef: "Matthew 11:28",
      shortText: "Come to me, all you who are weary and burdened, and I will give you rest.",
      prayer: { short: ["Jesus, I'm tired.", "Give me rest.", "Amen."],
                full: ["Jesus, I'm tired.", "You said to come to you, so I'm coming.", "You are gentle with me. Teach me to rest in you.", "Give me rest for my soul.", "Amen."] },
      rest: "You're allowed to rest now." },
    { label: "I'm angry or confused at God", ref: "Psalm 13:1, 5", lead: "This Psalm starts with a complaint, and God kept it in the Bible.",
      text: "How long, LORD? Will you forget me forever? How long will you hide your face from me?\nBut I trust in your unfailing love; my heart rejoices in your salvation.",
      prayer: { short: ["How long, Lord?", "Still, I trust your love.", "Amen."],
                full: ["Lord, I don't understand what you're doing.", "I'm telling you honestly: it hurts.", "Still, I'm choosing to trust your unfailing love.", "Amen."] },
      rest: "God can hold your questions too." },
    { label: "I feel empty or numb", ref: "Psalm 42:11", lead: "The writer talks to their own heavy heart.",
      text: "Why, my soul, are you downcast? Why so disturbed within me? Put your hope in God, for I will yet praise him, my Savior and my God.",
      prayer: { short: ["God, I feel empty.", "Hold onto me.", "Amen."],
                full: ["God, I feel downcast, and I can't fix it.", "Hold onto hope for me when I can't.", "You are still my God.", "Amen."] },
      rest: "You don't have to feel hopeful. God holds the hope." },
    { label: "I've lost someone", ref: "Psalm 34:18", lead: "You don't need to say anything. Just listen.",
      text: "The LORD is close to the brokenhearted and saves those who are crushed in spirit.",
      prayer: { short: ["Lord, be close to me.", "Amen."],
                full: ["Lord, my heart is broken.", "Be close to me.", "I don't have the words.", "Amen."] },
      rest: "You don't have to find words. God is near." }
  ];

  // The passage and prayer as tonight's check-in shapes them.
  function cur() {
    var it = state.item, c = state.cap;
    var short = c.attn <= 2 && !!it.shortText;
    return {
      ref: short ? it.shortRef : it.ref,
      text: short ? it.shortText : it.text,
      lead: c.think === 1 ? null : it.lead,
      prayer: (c.think <= 2 ? it.prayer.short : it.prayer.full).slice(),
      rest: it.rest,
      short: short
    };
  }
  var screen = document.getElementById("screen");
  var annot = document.getElementById("annot");
  var state = { night: 0, item: NIGHTS[0], token: 0, dimTimer: null, chaplain: false, reminder: null, prayers: [], view: null, auth: null,
    cap: { think: 1, read: 1, write: 1, attn: 2, env: 1 } };
  var CAP_DEFAULT = { think: 1, read: 1, write: 1, attn: 2, env: 1 };
  var CKEY = "nightwatch-capacity";
  try { var savedCap = JSON.parse(localStorage.getItem(CKEY) || "null"); if (savedCap) Object.keys(CAP_DEFAULT).forEach(function (k) { if (savedCap[k] >= 1 && savedCap[k] <= 5) state.cap[k] = savedCap[k]; }); } catch (e) {}

  // Each capacity: what Night Watch does at low (1-2), middle (3), and high (4-5).
  var CAPS = [
    { key: "think", name: "Cognitive ability", short: "Thinking",
      low: "Skip the introduction line and keep the prayer to two or three short lines.",
      mid: "Add a one-line introduction and use the fuller prayer.",
      high: "Add a one-line introduction and use the fuller prayer." },
    { key: "read", name: "Energy to read", short: "Reading",
      low: "Speak the passage aloud. The screen shows one phrase at a time in large type.",
      mid: "Offer listening and reading equally.",
      high: "Put reading first, with the whole passage on screen and the current phrase highlighted." },
    { key: "write", name: "Energy to write or type", short: "Writing",
      low: "Ask for no typing. Writing your own prayer stays a small link.",
      mid: "Keep writing your own prayer as a small link on the passage and the prayer.",
      high: "Invite you to add your own words after the prayer, with writing offered as a button there and on the rest screen." },
    { key: "attn", name: "Attention span", short: "Attention",
      low: "Choose a shorter passage, about two minutes, heard once.",
      mid: "Use the full passage, about three minutes, with longer pauses.",
      high: "Use the full passage, about five minutes, heard twice, the second time slower." },
    { key: "env", name: "Freedom to make sound or light", short: "Sound & light",
      low: "Dim the screen and keep the voice low. One earbud suggested.",
      mid: "Use normal brightness and a low voice.",
      high: "Use full brightness and a fuller voice. Fine to play aloud." }
  ];
  function band(v) { return v <= 2 ? "low" : v === 3 ? "mid" : "high"; }
  function cellsHtml(key, v, prefix) {
    var out = '<span class="cells" role="group" aria-label="Level">';
    for (var n = 1; n <= 5; n++) out += '<button type="button" class="' + (n <= v ? "on" : "") + '" data-cap="' + key + '" data-v="' + n + '" aria-pressed="' + (n === v) + '" aria-label="Level ' + n + ' of 5" id="' + prefix + key + n + '"></button>';
    return out + '</span>';
  }
  function applyEnv() { screen.style.setProperty("--bright", [0.72, 0.8, 0.9, 1, 1][state.cap.env - 1]); }
  function setCap(key, v) {
    state.cap[key] = v;
    try { localStorage.setItem(CKEY, JSON.stringify(state.cap)); } catch (e) {}
    applyEnv();
    if (state.view === "open") { var st = view.scrollTop; open(); view.scrollTop = st; }
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-cap]");
    if (b) setCap(b.getAttribute("data-cap"), +b.getAttribute("data-v"));
  });
  function pace() { return state.cap.attn >= 4 ? 1.5 : state.cap.attn === 3 ? 1.25 : 1; }
  var PKEY = "nightwatch-prayers";
  try { state.prayers = JSON.parse(localStorage.getItem(PKEY) || "[]"); } catch (e) { state.prayers = []; }
  function storePrayers() { try { localStorage.setItem(PKEY, JSON.stringify(state.prayers)); } catch (e) {} }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/LORD/g, '<span class="sc">Lord</span>'); }
  function tag(part, text) { if (annot) annot.innerHTML = '<span class="tag">' + part + '</span><span>' + text + '</span>'; }
  // Click handlers get no arguments, so a screen function never mistakes the click event for one of its own.
  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener("click", function () { fn(); }); }

  function hush() {
    state.token++;
    state.view = null;
    if (state.dimTimer) { clearTimeout(state.dimTimer); state.dimTimer = null; }
    screen.classList.remove("dimmed");
    view.classList.remove("center");
    view.classList.remove("pinned");
    view.scrollTop = 0;
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  }

  // Speak a line softly; always calls done, even if speech is blocked or never fires its end event.
  // Remember how to redraw the current screen, so a detour can come back to it.
  function mark(fn, name) { state.here = fn; state.hereName = name || ""; }

  function say(text, done, voiced, slow) {
    var t = state.token, fired = false;
    var words = text.split(/\s+/).length;
    function finish() { if (fired || t !== state.token) return; fired = true; done(); }
    var k = pace() * (slow ? 1.3 : 1);
    setTimeout(finish, (voiced ? words * 520 * (slow ? 1.2 : 1) + 2600 : Math.max(4200, words * 380 + 2200)) * k);
    if (!voiced) return;
    try {
      var u = new SpeechSynthesisUtterance(text.replace(/LORD/g, "Lord"));
      u.rate = slow ? 0.7 : 0.8; u.pitch = 0.95; u.volume = [0.45, 0.55, 0.7, 0.85, 1][state.cap.env - 1];
      u.onend = function () { setTimeout(finish, 1400 * k); };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // A "\n" in a passage marks where a new verse starts after skipped verses; that phrase keeps a leading "\n".
  function phrases(text) {
    return text.split("\n").reduce(function (all, verse, v) {
      var ph = verse.split(/(?<=[.?!;])\s+/).reduce(function (acc, part) {
        if (acc.length && acc[acc.length - 1].length < 24) acc[acc.length - 1] += " " + part; else acc.push(part);
        return acc;
      }, []);
      if (v > 0) ph[0] = "\n" + ph[0];
      return all.concat(ph);
    }, []);
  }
  function vfmt(x) { return x.charAt(0) === "\n" ? "<br>" + fmt(x.slice(1)) : fmt(x); }

  // The check-in comes first, every time. It starts at the lowest settings, so Next is always one tap away.
  function open() {
    if (!state.auth) { home(); return; }
    hush();
    state.view = "open";
    var c = state.cap;
    mark(open, "open");
    view.innerHTML =
      '<button class="back" type="button" id="o-back">\u2190 Back to start</button>' +
      '<span class="tiny">Night Watch · Night ' + (state.night + 1) + ' · 1 of 2</span>' +
      '<h2 class="kanit">You’re awake.<br>You’re not alone.</h2>' +
      '<p class="sub">First, how much do you have right now? It’s already set low. If you’re not sure, just tap Next.</p>' +
      '<button class="btn quiet nowords" type="button" id="o-words">I don’t have words</button>' +
      '<div class="adj">' + CAPS.map(function (cp) {
        var v = c[cp.key];
        return '<div class="adj-row"><div class="top"><span>' + cp.short + '</span><span>' + (v <= 2 ? "Very little" : v === 3 ? "Some" : "Plenty") + '</span></div>' + cellsHtml(cp.key, v, "a-") + '</div>';
      }).join("") + '</div>' +
      '<button class="btn primary" type="button" id="o-next">Next</button>' +
      '<div class="pnav"><button class="linkbtn" type="button" id="o-account">' + (state.auth.type === "guest" ? "Guest" : "Account") + '</button>' +
      (state.reminder ? '<span class="pill">Daily reminder · ' + esc(state.reminder.label) + '</span>' : '') + '</div>';
    on("o-back", function () { state.auth = null; home(); });
    on("o-next", weigh);
    on("o-words", function () { words(open); });
    on("o-account", account);
    tag("Encounter", "Step 1 of 2: how much you have right now, already set to the lowest settings. This decides how long the passage and prayer are and how they’re given to you.");
  }

  // Screen 2: what's weighing on you. The answer picks the passage; the check-in shapes it.
  function weigh() {
    hush();
    state.view = "weigh";
    var it = cur(), c = state.cap;
    var mins = c.attn >= 4 ? "About five minutes." : c.attn === 3 ? "About three minutes." : "About two minutes.";
    var sound = c.env <= 2 ? "One earbud, low volume." : c.env === 3 ? "Low volume." : "Fine to play it out loud.";
    var reading = c.read >= 4;
    var night = NIGHTS[state.night];
    function choice(label, i, picked) {
      return '<button class="choice' + (picked ? ' picked' : '') + '" type="button" data-w="' + i + '" aria-pressed="' + picked + '">' + esc(label) + '</button>';
    }
    mark(weigh, "weigh");
    view.innerHTML =
      '<button class="back" type="button" id="w-back">\u2190 Back to check-in</button>' +
      '<span class="tiny">Night Watch · Night ' + (state.night + 1) + ' · 2 of 2</span>' +
      '<h2 class="kanit">What’s weighing on you?</h2>' +
      '<p class="sub">Pick one if it helps, and Night Watch will choose a passage for it. Or just tap Begin.</p>' +
      '<div class="btns">' +
        choice("Nothing in particular", -1, state.item === night) +
        MOMENTS.map(function (m, i) { return choice(m.label, i, state.item === m); }).join("") +
      '</div>' +
      '<div class="card"><span class="ref">Tonight for you</span><p><strong>' + fmt(it.ref) + '</strong>, ' + (reading ? 'on screen to read' : 'spoken softly') + (c.attn >= 4 ? ' twice' : '') + ', then ' + (c.think <= 2 ? 'a short prayer' : 'a fuller prayer') + '. ' + mins + ' ' + sound + '</p></div>' +
      '<button class="btn primary" type="button" id="w-begin">Begin</button>' +
      '<div class="pnav"><button class="linkbtn" type="button" id="w-mode">' + (reading ? 'Listen instead' : 'Read instead') + '</button></div>';
    on("w-back", open);
    on("w-begin", function () { play(!reading); });
    on("w-mode", function () { play(reading); });
    view.querySelectorAll("[data-w]").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = +b.getAttribute("data-w");
        state.item = i < 0 ? night : MOMENTS[i];
        var st = view.scrollTop; weigh(); view.scrollTop = st;
      });
    });
    tag("Encounter", "Step 2 of 2: naming what you’re carrying, in one tap. Each answer leads to a passage that speaks to it, including lament Psalms that show honest complaint is welcome before God. Skip it and you get tonight’s Psalm.");
  }

  // Home: the first screen. Sign up, log in, or start as a guest.
  function home(msg) {
    hush();
    mark(function () { home(); }, "home");
    view.classList.add("center");
    view.innerHTML =
      '<div class="home">' +
        '<span class="home-mark" aria-hidden="true"></span>' +
        '<h1 class="home-title">Night Watch</h1>' +
        '<p class="home-desc">A Psalm and a prayer for when you’re awake in the hospital at night. About two minutes.</p>' +
      '</div>' +
      (msg ? '<p class="sub" role="status" style="text-align:center">' + esc(msg) + '</p>' : '') +
      '<div class="btns">' +
        '<button class="btn primary" type="button" id="h-signup">Sign up</button>' +
        '<button class="btn" type="button" id="h-login">Log in</button>' +
        '<button class="btn quiet" type="button" id="h-guest">Continue as guest</button>' +
      '</div>' +
      '<button class="btn quiet nowords" type="button" id="h-words">I don’t have words</button>' +
      '<p class="sub" style="font-size:0.82rem;text-align:center">Guest needs no email. Everything stays on this phone.</p>';
    on("h-signup", function () { gate("signup"); });
    on("h-login", function () { gate("login"); });
    on("h-guest", function () { state.auth = { type: "guest" }; open(); });
    on("h-words", function () { words(home); });
    tag("Encounter", "The home screen. Sign up creates an account, log in uses one you already have, and guest starts right away with nothing to fill in. In the product you'd choose once, at the evening setup, and stay signed in.");
  }

  // Sign up: email and password, then confirm the email address. Log in: email and password, straight in.
  function gate(mode) {
    mode = mode === "login" ? "login" : "signup";
    var signup = mode === "signup";
    hush();
    mark(function () { gate(mode); }, "gate");
    view.innerHTML =
      '<button class="back" type="button" id="g-back">← Back</button>' +
      '<span class="tiny">' + (signup ? 'Sign up' : 'Log in') + '</span>' +
      '<h2>' + (signup ? 'Create your account.' : 'Welcome back.') + '</h2>' +
      '<p class="sub">' + (signup
        ? 'An account carries your reading path, reminder, and settings to any phone, including after you go home. We’ll email you to confirm your address.'
        : 'Log in with the email and password you signed up with. You’ll stay logged in on this phone.') + '</p>' +
      '<label class="field" for="g-email">Email<input type="email" id="g-email" autocomplete="email" inputmode="email" placeholder="name@example.com"></label>' +
      '<label class="field" for="g-pass">' + (signup ? 'Create a password' : 'Password') + '<input type="password" id="g-pass" autocomplete="' + (signup ? 'new-password' : 'current-password') + '"' + (signup ? ' placeholder="At least 8 characters"' : '') + '></label>' +
      '<p class="err" id="g-err" role="alert"></p>' +
      '<button class="btn primary" type="button" id="g-go">' + (signup ? 'Create account' : 'Log in') + '</button>' +
      (signup ? '' : '<button class="linkbtn" type="button" id="g-forgot" style="justify-self:center">Forgot your password?</button>') +
      '<button class="linkbtn" type="button" id="g-switch" style="justify-self:center">' + (signup ? 'Already have an account? Log in' : 'New here? Sign up') + '</button>' +
      '<p class="sub" style="font-size:0.82rem;text-align:center">Prototype only. Nothing you type here is checked, sent, or saved.</p>';
    var err = document.getElementById("g-err");
    function email() { return document.getElementById("g-email").value.trim(); }
    function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
    function go() {
      var v = email(), pw = document.getElementById("g-pass").value;
      if (!validEmail(v)) { err.textContent = "Enter an email address like name@example.com."; return; }
      if (signup && pw.length < 8) { err.textContent = "Use at least 8 characters for your password."; return; }
      if (!signup && !pw) { err.textContent = "Enter your password."; return; }
      if (signup) sent(v, "signup");
      else { state.auth = { type: "account", email: v }; open(); }
    }
    on("g-back", function () { home(); });
    on("g-go", go);
    on("g-forgot", function () {
      var v = email();
      if (!validEmail(v)) { err.textContent = "Enter your email first, and we’ll send a link to reset your password."; return; }
      sent(v, "reset");
    });
    on("g-switch", function () { gate(signup ? "login" : "signup"); });
    ["g-email", "g-pass"].forEach(function (id) {
      document.getElementById(id).addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
    });
    tag("Encounter", signup
      ? "Sign up asks for an email and a password, then sends a confirmation email so the address is really yours. You do this once, at the evening setup, not at 3 a.m."
      : "Log in takes your email and password and signs you straight in, with no email to wait for. You stay logged in on this phone, so at night Night Watch opens without asking again.");
  }

  // Check your email: confirming a new account, or resetting a forgotten password.
  function sent(email, mode) {
    var signup = mode === "signup";
    hush();
    mark(function () { sent(email, mode); }, "sent");
    view.innerHTML =
      '<button class="back" type="button" id="s-back">← Back</button>' +
      '<span class="tiny">Check your email</span>' +
      '<h2>' + (signup ? 'Confirm your email address.' : 'Reset your password.') + '</h2>' +
      '<p class="sub">We sent a link to <strong style="color:var(--text);overflow-wrap:anywhere">' + esc(email) + '</strong>. Open it on this phone to ' + (signup ? 'confirm it’s your address and finish creating your account' : 'choose a new password') + '.</p>' +
      '<p class="sub" style="font-size:0.82rem">Prototype only. No email was sent.</p>' +
      '<div class="btns"><button class="btn primary" type="button" id="s-open">Open the link (demo)</button>' +
      '<button class="btn" type="button" id="s-other">' + (signup ? 'Use a different email' : 'Back to log in') + '</button>' +
      '<button class="btn quiet" type="button" id="s-guest">Continue as guest instead</button></div>';
    on("s-back", function () { gate(signup ? "signup" : "login"); });
    on("s-open", function () { state.auth = { type: "account", email: email }; open(); });
    on("s-other", function () { gate(signup ? "signup" : "login"); });
    on("s-guest", function () { state.auth = { type: "guest" }; open(); });
    tag("Encounter", signup ? "The confirmation email proves the address is yours. Opening the link creates the account and signs you in." : "Only a forgotten password needs an email. The link lets you set a new one and signs you in.");
  }

  function account() {
    hush();
    mark(account, "account");
    var a = state.auth, armed = false;
    var guest = a.type === "guest";
    view.innerHTML =
      '<button class="back" type="button" id="ac-back">← Back to check-in</button>' +
      '<span class="tiny">' + (guest ? 'Guest account' : 'Your account') + '</span>' +
      '<h2>' + (guest ? 'You’re using a guest account.' : 'Signed in') + '</h2>' +
      (guest
        ? '<p class="sub">Everything stays on this phone. Create an account if you want your reading path and reminder to follow you home.</p>'
        : '<p class="sub" style="overflow-wrap:anywhere">' + esc(a.email) + '</p>' +
          '<div class="card"><span class="ref">Saved to your account</span><p>Your place in the reading path, your reminder time, and your settings for tonight.</p></div>' +
          '<div class="card"><span class="ref">Never saved to your account</span><p>Prayers you write and how you said you felt. Those stay on this phone or aren’t kept at all.</p></div>') +
      '<div class="btns">' +
        (guest ? '<button class="btn primary" type="button" id="ac-create">Create an account</button>' : '') +
        '<button class="btn" type="button" id="ac-out">' + (guest ? 'End guest session' : 'Sign out') + '</button>' +
        (guest ? '' : '<button class="btn quiet danger" type="button" id="ac-del">Delete my account</button>') +
      '</div>' +
      '<p class="sub" id="ac-msg" style="font-size:0.85rem"></p>';
    on("ac-back", open);
    on("ac-create", function () { state.auth = null; gate("signup"); });
    on("ac-out", function () { state.auth = null; home(); });
    on("ac-del", function () {
      if (!armed) {
        armed = true;
        document.getElementById("ac-del").textContent = "Tap again to delete everything";
        document.getElementById("ac-msg").textContent = "This deletes your account and everything saved in it. It can’t be undone.";
        return;
      }
      state.auth = null; state.reminder = null;
      home("Your account was deleted (demo).");
    });
    tag("Continuation", guest
      ? "A guest account works fully. An account only adds carrying your place to other phones and home after discharge."
      : "You can see exactly what the account keeps, sign out, or delete it and everything in it.");
  }

  // For nights with nothing left: no sign-in, no check-in, no choices. A verse, then a breath to follow.
  function words(back) {
    hush();
    var t = state.token, inhale = true;
    mark(function () { words(back); }, "words");
    view.classList.add("center");
    view.innerHTML =
      '<button class="back" type="button" id="wd-back">\u2190 Back</button>' +
      '<div class="words">' +
        '<span class="tiny">Scripture</span>' +
        '<p class="words-verse">“' + fmt("In the same way, the Spirit helps us in our weakness. We do not know what we ought to pray for, but the Spirit himself intercedes for us through wordless groans.") + '”</p>' +
        '<span class="ref">Romans 8:26 · NIV</span>' +
        '<div class="breath" aria-hidden="true"></div>' +
        '<p class="breath-line" id="wd-line" aria-live="polite">Be still,</p>' +
        '<span class="ref">Psalm 46:10 · NIV</span>' +
        '<span class="tiny" style="margin-top:0.75rem">Breathe in as the circle grows, out as it shrinks</span>' +
      '</div>' +
      '<button class="linkbtn" type="button" id="wd-done" style="justify-self:center;margin-top:1.5rem">I’m done</button>';
    var line = document.getElementById("wd-line");
    function tick() {
      if (t !== state.token) return;
      line.classList.add("fade");
      setTimeout(function () {
        if (t !== state.token) return;
        inhale = !inhale;
        line.textContent = inhale ? "Be still," : "and know that I am God.";
        line.classList.remove("fade");
        setTimeout(tick, inhale ? 3200 : 5200);
      }, 800);
    }
    setTimeout(tick, 3200);
    on("wd-back", back);
    on("wd-done", function () { wordsEnd(back); });
    state.dimTimer = setTimeout(function () { screen.classList.add("dimmed"); }, 20000);
    tag("Response", "For when even the check-in is too much. No sign-in, no scales, nothing to choose: a promise that the Spirit prays when you can’t, and one line of a Psalm to breathe with. The words change with the circle: in on “Be still,” out on “and know that I am God.” The screen dims after a while.");
  }

  // Back to the start: the check-in if you're signed in or a guest, otherwise the home screen. Tonight's Psalm is the default again.
  function restart() {
    state.item = NIGHTS[state.night];
    if (state.auth) open(); else home();
  }

  function wordsEnd(back) {
    hush();
    mark(function () { wordsEnd(back); }, "wordsEnd");
    view.classList.add("center");
    view.innerHTML =
      '<button class="back" type="button" id="we-back">\u2190 Back to breathing</button>' +
      '<p class="restline">You can put the phone down now.</p>' +
      '<p class="restsub">You didn’t need words. The Spirit is praying for you.</p>' +
      '<div class="btns" style="margin-top:2.5rem">' +
        '<button class="btn quiet" type="button" id="we-again">Stay a little longer</button>' +
        '<button class="btn quiet" type="button" id="we-start">Return to beginning</button>' +
      '</div>';
    on("we-back", function () { words(back); });
    on("we-again", function () { words(back); });
    on("we-start", restart);
    state.dimTimer = setTimeout(function () { screen.classList.add("dimmed"); }, 6000);
    tag("Response", "It ends the same way as the full path: no next item, and the screen dims itself.");
  }

  function play(voiced, startAt) {
    hush();
    if (voiced && !("speechSynthesis" in window)) voiced = false;
    var it = cur(), c = state.cap;
    var ph = phrases(it.text);
    var parts = (it.lead ? [{ text: it.lead, team: true }] : []).concat(ph.map(function (x, k) { return { text: x, k: k }; }));
    if (c.attn >= 4) parts = parts.concat([{ text: "Once more, slowly.", team: true }], ph.map(function (x, k) { return { text: x, k: k, slow: true }; }));
    var full = !voiced && c.read >= 4;
    var i = startAt || 0, t = state.token;
    state.voiced = voiced;
    mark(function () { play(voiced, 0); }, "play");
    view.innerHTML =
      '<button class="back" type="button" id="p-back">\u2190 Back</button>' +
      '<span class="tiny" id="p-label">Written by our team, not Scripture</span>' +
      '<p class="phrase' + (full ? ' full' : '') + '" id="phrase"></p>' +
      '<span class="ref">' + fmt(it.ref) + ' · NIV</span>' +
      '<div class="dots" id="dots">' + parts.map(function () { return "<i></i>"; }).join("") + '</div>' +
      '<div class="row2"><button class="btn quiet" type="button" id="p-restart">↺ Start over</button><button class="btn quiet" type="button" id="p-skip">Next</button></div>' +
      '<div class="pnav"><button class="linkbtn" type="button" id="p-write">Write your own prayer</button></div>';
    var el = document.getElementById("phrase"), label = document.getElementById("p-label"), dots = document.getElementById("dots").children;
    function step() {
      if (t !== state.token) return;
      if (i >= parts.length) { feel(voiced); return; }
      var part = parts[i];
      el.classList.add("fade");
      setTimeout(function () {
        if (t !== state.token) return;
        if (full && !part.team) {
          el.innerHTML = ph.map(function (x, k) { return '<span class="' + (k === part.k ? "cur" : "") + '">' + vfmt(x) + '</span>'; }).join(" ");
        } else {
          el.innerHTML = "<span>" + fmt(part.text.trim()) + "</span>";
        }
        label.textContent = part.team ? "Written by our team, not Scripture" : "Scripture";
        el.style.fontStyle = part.team ? "italic" : "normal";
        for (var d = 0; d < dots.length; d++) dots[d].className = d <= i ? "on" : "";
        el.classList.remove("fade");
        say(part.text, function () { i++; step(); }, voiced, part.slow);
      }, 500);
    }
    on("p-back", weigh);
    on("p-skip", function () { var k = i + 1; hush(); t = state.token; i = k; step(); });
    on("p-restart", function () { play(voiced, 0); });
    on("p-write", function () { var at = Math.min(i, parts.length - 1); write(function () { play(voiced, at); }, "Back to the passage"); });
    step();
    var how = voiced ? "Spoken softly, one phrase at a time." : full ? "The whole passage on screen, with the current phrase highlighted, because you said you have energy to read." : "Read quietly: one phrase at a time in large type, moving on by itself.";
    if (c.attn >= 4) how += " You have time tonight, so you'll hear it twice, the second time slower.";
    else if (c.attn === 3) how += " Longer pauses between phrases.";
    if (voiced) how += " (Prototype uses your device's voice. Production would use recorded audio from YouVersion.)";
    tag("Encounter", how);
  }

  // Optional 1-10 check-in after the passage. Never saved or sent.
  function feel(voiced) {
    hush();
    var it = cur(), nums = "";
    for (var n = 1; n <= 10; n++) nums += '<button type="button" id="f-' + n + '" data-f="' + n + '" aria-label="' + n + ' out of 10">' + n + '</button>';
    mark(function () { feel(voiced); }, "feel");
    view.innerHTML =
      '<button class="back" type="button" id="f-back">\u2190 Back to the passage</button>' +
      '<span class="tiny">Optional</span>' +
      '<h2 class="kanit">How are you feeling now?</h2>' +
      '<p class="sub">After ' + fmt(it.ref) + '. Tap a number, or skip.</p>' +
      '<div class="scale10" role="group" aria-label="How you feel, 1 to 10">' + nums + '</div>' +
      '<div class="scale-ends"><span>1 · Overwhelmed</span><span>10 · At peace</span></div>' +
      '<p class="sub" style="font-size:0.82rem">Your answer isn’t saved or sent. It only helps Night Watch respond to you.</p>' +
      '<div class="btns"><button class="btn" type="button" id="f-skip">Skip to the prayer</button></div>';
    view.querySelectorAll("[data-f]").forEach(function (b) {
      b.addEventListener("click", function () { felt(+b.getAttribute("data-f"), voiced); });
    });
    on("f-back", function () { play(voiced, 0); });
    on("f-skip", function () { pray(voiced); });
    tag("Response", "An optional check-in, never required. Night Watch uses the answer only to respond to you in the moment.");
  }

  function felt(score, voiced) {
    hush();
    var head, body, extra = "", note;
    if (score <= 2) {
      head = "Thank you for telling us.";
      body = "You don’t have to carry this alone tonight. A chaplain is available right now.";
      extra = '<div class="card"><p>If you’re thinking about harming yourself, tell your nurse now, or call or text <strong style="user-select:all">988</strong>.</p></div>';
      note = "A very low answer brings a person forward first. The prayer is still there.";
    } else if (score <= 5) {
      head = "That’s an honest answer.";
      body = "The prayer may help put it into words. Or you can hear the passage again.";
      note = "A middle answer offers the passage again, or a person, alongside the prayer.";
    } else if (score <= 8) {
      head = "Stay with that for a moment.";
      body = "When you’re ready, here are some words to pray.";
      note = "A good answer goes straight on to the prayer.";
    } else {
      head = "Rest in that.";
      body = "When you’re ready, here are some words to pray.";
      note = "A high answer goes straight on to the prayer.";
    }
    mark(function () { felt(score, voiced); }, "felt");
    view.innerHTML =
      '<button class="back" type="button" id="g-back">\u2190 Change my answer</button>' +
      '<span class="tiny">You said ' + score + ' of 10</span>' +
      '<h2>' + head + '</h2>' +
      '<p class="sub">' + body + '</p>' + extra +
      '<div class="btns">' +
        (score <= 2 ? '<button class="btn primary" type="button" id="g-talk">Talk to someone now</button><button class="btn" type="button" id="g-pray">Continue to the prayer</button>'
          : '<button class="btn primary" type="button" id="g-pray">Continue to the prayer</button>') +
        (score >= 3 && score <= 5 ? '<button class="btn" type="button" id="g-again">↺ Hear the passage again</button><button class="btn quiet" type="button" id="g-talk">Talk to someone</button>' : '') +
      '</div>';
    on("g-pray", function () { pray(voiced); });
    on("g-talk", talkNow);
    on("g-again", function () { play(voiced, 0); });
    on("g-back", function () { feel(voiced); });
    tag("Response", note);
  }

  function pray(voiced) {
    hush();
    var it = cur(), t = state.token;
    state.voiced = voiced;
    mark(function () { pray(voiced); }, "pray");
    view.innerHTML =
      '<button class="back" type="button" id="r-back">\u2190 Back to how you\u2019re feeling</button>' +
      '<span class="tiny">If you don’t have words, you can borrow these.<br>A prayer from the words of ' + esc(it.ref) + ', written by our team.</span>' +
      '<div class="prayer" id="prayer">' + it.prayer.map(function (l) { return '<span style="opacity:0.25">' + esc(l) + '</span>'; }).join("") + '</div>' +
      (state.cap.write >= 4 ? '<p class="sub">Anything else you want to tell God? You can add your own words.</p>' : '') +
      '<div class="dock" id="dock">' +
        '<div class="btns"><button class="btn primary" type="button" id="r-amen">Amen</button>' +
          (state.cap.write >= 4 ? '<button class="btn" type="button" id="r-write">Write your own prayer</button>' : '') + '</div>' +
        '<div class="pnav">' + (state.cap.write >= 4 ? '<span></span>' : '<button class="linkbtn" type="button" id="r-write">Write your own prayer</button>') + '<button class="linkbtn" type="button" id="r-restart">\u21BA Start the passage over</button></div>' +
      '</div>';
    view.classList.add("pinned");
    var lines = document.getElementById("prayer").children, i = 0, dock = document.getElementById("dock");
    function next() {
      if (t !== state.token || i >= lines.length) return;
      lines[i].style.opacity = 1;
      // Keep the line being prayed visible above the pinned buttons.
      var r = lines[i].getBoundingClientRect(), d = dock.getBoundingClientRect();
      if (r.bottom > d.top - 8) view.scrollTop += r.bottom - d.top + 24;
      say(it.prayer[i], function () { i++; next(); }, voiced);
    }
    on("r-back", function () { feel(voiced); });
    on("r-amen", rest);
    on("r-write", function () { write(function () { pray(voiced); }, "Back to the prayer"); });
    on("r-restart", function () { play(voiced, 0); });
    next();
    tag("Response", "The main action. A prayer built from the passage's own words, so you can whisper it, or just listen and say amen. It gives the helplessness something to do.");
  }

  // Write your own prayer. Kept only on this phone; never sent.
  function write(back, backLabel) {
    hush();
    var it = cur();
    function savedList() {
      var mine = state.prayers.slice().reverse();
      if (!mine.length) return '';
      return '<span class="tiny">Your prayers · on this phone only</span><div class="saved">' + mine.map(function (p) {
        return '<div class="saved-item"><div class="meta"><span class="ref">' + esc(p.ref) + ' · ' + esc(p.when) + '</span><button class="del" type="button" data-id="' + p.id + '">Delete</button></div><p>' + esc(p.text) + '</p></div>';
      }).join("") + '</div>';
    }
    mark(function () { write(back, backLabel); }, "write");
    view.innerHTML =
      '<button class="back" type="button" id="w-back">← ' + esc(backLabel) + '</button>' +
      '<span class="tiny">Your own prayer · ' + esc(it.ref) + '</span>' +
      '<h2>Say it to God in your own words.</h2>' +
      '<label for="w-text" class="sub">A few words is enough. Spelling doesn’t matter.</label>' +
      '<textarea class="mine" id="w-text" placeholder="Lord, tonight I…"></textarea>' +
      '<div class="row2"><button class="btn" type="button" id="w-borrow">Start from our prayer</button><button class="btn primary" type="button" id="w-save">Save prayer</button></div>' +
      '<p class="sub" id="w-status" style="font-size:0.85rem">Saved only on this phone. Nothing is sent, and you can delete it any time.</p>' +
      '<div id="w-list">' + savedList() + '</div>';
    var box = document.getElementById("w-text"), status = document.getElementById("w-status"), list = document.getElementById("w-list");
    function bindDeletes() {
      list.querySelectorAll("[data-id]").forEach(function (b) {
        b.addEventListener("click", function () {
          var id = b.getAttribute("data-id");
          state.prayers = state.prayers.filter(function (p) { return String(p.id) !== id; });
          storePrayers(); list.innerHTML = savedList(); bindDeletes();
          status.textContent = "Deleted.";
        });
      });
    }
    on("w-back", back);
    on("w-borrow", function () {
      box.value = it.prayer.filter(function (l) { return l !== "Amen."; }).join("\n") + "\n";
      box.focus();
    });
    on("w-save", function () {
      var text = box.value.trim();
      if (!text) { status.textContent = "Write a few words first, or go back. There’s no need to write anything."; return; }
      var d = new Date();
      state.prayers.push({ id: d.getTime(), ref: it.ref, when: d.toLocaleDateString(undefined, { month: "short", day: "numeric" }), text: text });
      storePrayers();
      box.value = "";
      list.innerHTML = savedList(); bindDeletes();
      status.textContent = "Saved on this phone. Amen.";
    });
    bindDeletes();
    tag("Response", "Optional, never required. Write in your own words, or start from the team's prayer and change it. Saved only on this phone, never sent.");
  }

  function rest() {
    hush();
    var it = cur();
    var tomorrow = NIGHTS[(state.night + 1) % NIGHTS.length].ref;
    mark(rest, "rest");
    view.classList.add("center");
    view.innerHTML =
      '<button class="back" type="button" id="z-back">\u2190 Back to the prayer</button>' +
      '<p class="restline">You can put the phone down now.</p>' +
      '<p class="restsub">' + esc(it.rest) + '</p>' +
      '<div class="btns" style="margin-top:2.5rem">' +
        '<button class="btn quiet" type="button" id="z-chap">Let a chaplain know I was up</button>' +
        '<button class="btn quiet" type="button" id="z-tom">Tomorrow night</button>' +
        (state.cap.write >= 4 ? '<button class="btn quiet" type="button" id="z-write">Write a prayer before you rest</button>' : '') +
        '<button class="btn quiet" type="button" id="z-rem">' + (state.reminder ? 'Daily reminder \u00B7 ' + esc(state.reminder.label) : 'Remind me each day') + '</button>' +
        '<button class="btn quiet" type="button" id="z-start">Return to beginning</button>' +
      '</div>';
    on("z-back", function () { pray(state.voiced); });
    on("z-chap", function () { morning(rest); });
    on("z-rem", function () { reminder(rest); });
    on("z-write", function () { write(rest, "Back"); });
    on("z-tom", function () { tomorrowView(tomorrow); });
    on("z-start", restart);
    state.dimTimer = setTimeout(function () { screen.classList.add("dimmed"); }, 6000);
    tag("Response", "The goal. The session ends here, with no feed and no next item. After a few seconds the screen dims itself.");
  }

  function tomorrowView(ref) {
    hush();
    mark(function () { tomorrowView(ref); }, "tomorrow");
    view.innerHTML =
      '<button class="back" type="button" id="t-back">← Back</button>' +
      '<span class="tiny">Tomorrow night</span>' +
      '<h2>' + esc(ref) + ' will be waiting.</h2>' +
      '<div class="card"><span class="ref">During the stay</span><p>Same icon, same one tap. The next Psalm is tracked by date. With an account, it follows you to any phone.</p></div>' +
      '<div class="card"><span class="ref">When you go home</span><p>The discharge packet includes these Psalms as a YouVersion reading plan, in your language.</p></div>' +
      '<div class="card"><span class="ref">If you want people nearby</span><p>A chaplain can connect you with a local congregation’s care team. Only if you ask.</p></div>' +
      '<button class="btn" type="button" id="t-rem">' + (state.reminder ? 'Daily reminder \u00B7 ' + esc(state.reminder.label) : 'Remind me each day') + '</button>';
    on("t-back", rest);
    on("t-rem", function () { reminder(function () { tomorrowView(ref); }); });
    tag("Continuation", "An ongoing practice for the rest of the stay, continued access after discharge, and community only by choice.");
  }

  function label12(v) {
    var h = +v.split(":")[0], m = v.split(":")[1];
    return ((h % 12) || 12) + ":" + m + (h < 12 ? " am" : " pm");
  }

  // Opt-in daily reminder for the passage of the day. Simulated: nothing is scheduled.
  function reminder(back) {
    hush();
    mark(function () { reminder(back); }, "reminder");
    var next = NIGHTS[(state.night + 1) % NIGHTS.length].ref;
    if (state.reminder) {
      view.innerHTML =
        '<button class="back" type="button" id="r-back">← Back</button>' +
        '<span class="tiny">Daily reminder</span>' +
        '<h2>Set for ' + esc(state.reminder.label) + ' each day.</h2>' +
        '<p class="sub">' + (state.reminder.silent ? 'It arrives silently. ' : 'It plays a soft sound. ') + 'One a day, never repeated if you miss it.</p>' +
        '<div class="lock"><div class="top"><span>Night Watch</span><span>' + esc(state.reminder.label) + '</span></div><p>Today’s passage is ready: ' + esc(next) + '. Two minutes, whenever you want it.</p></div>' +
        '<p class="note" style="font-size:0.8rem;color:var(--dim)">Prototype only. Nothing was scheduled.</p>' +
        '<div class="row2"><button class="btn" type="button" id="r-change">Change time</button><button class="btn" type="button" id="r-off">Turn off</button></div>';
      on("r-back", back);
      on("r-change", function () { var keep = state.reminder; state.reminder = null; reminder(back); state.reminder = keep; });
      on("r-off", function () { state.reminder = null; back(); });
      tag("Continuation", "Easy to change or turn off from the same screen. Turning it off deletes the schedule.");
      return;
    }
    var chosen = "21:00";
    view.innerHTML =
      '<button class="back" type="button" id="r-back">← Back</button>' +
      '<span class="tiny">Daily reminder · optional</span>' +
      '<h2>When should we let you know the day’s passage is ready?</h2>' +
      '<div class="presets" role="group" aria-label="Suggested times">' +
        '<button class="preset" type="button" data-t="07:00">Morning, 7:00 am</button>' +
        '<button class="preset" type="button" data-t="21:00">Evening, 9:00 pm</button>' +
      '</div>' +
      '<label class="timefield" for="rem-time">Or choose a time <input type="time" id="rem-time" value="21:00"></label>' +
      '<label class="check" for="rem-silent"><input type="checkbox" id="rem-silent" checked><span>Silent, with no sound or vibration, so it won’t wake anyone</span></label>' +
      '<div class="lock" aria-label="Notification preview"><div class="top"><span>Night Watch</span><span id="rem-prev">9:00 pm</span></div><p>Today’s passage is ready: ' + esc(next) + '. Two minutes, whenever you want it.</p></div>' +
      '<p class="sub" id="rem-warn" style="font-size:0.85rem"></p>' +
      '<div class="row2"><button class="btn primary" type="button" id="r-set">Remind me</button><button class="btn" type="button" id="r-no">Not now</button></div>';
    var input = document.getElementById("rem-time"), prev = document.getElementById("rem-prev"), warn = document.getElementById("rem-warn");
    var presets = view.querySelectorAll("[data-t]");
    function sync() {
      chosen = input.value || "21:00";
      prev.textContent = label12(chosen);
      presets.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-t") === chosen ? "true" : "false"); });
      var h = +chosen.split(":")[0];
      warn.textContent = (h >= 23 || h < 6) ? "This is during the night. We’ll keep it silent unless you change that." : "";
    }
    presets.forEach(function (b) { b.addEventListener("click", function () { input.value = b.getAttribute("data-t"); sync(); }); });
    input.addEventListener("input", sync);
    on("r-back", back);
    on("r-no", back);
    on("r-set", function () {
      state.reminder = { time: chosen, label: label12(chosen), silent: document.getElementById("rem-silent").checked };
      reminder(back);
    });
    sync();
    tag("Continuation", "Opt-in only. You pick the time, it's one a day, and it's silent by default. No streaks, no repeats if you miss it.");
  }

  function morning(back) {
    hush();
    back = back || rest;
    mark(function () { morning(back); }, "morning");
    if (state.chaplain) {
      view.innerHTML =
        '<button class="back" type="button" id="c-top">\u2190 Back</button>' +
        '<span class="tiny">Chaplain</span><h2>A chaplain will stop by Room 412 this morning.</h2>' +
        '<p class="sub">Sleep if you can. Prototype only. Nothing was sent.</p>' +
        '<div class="btns"><button class="btn" type="button" id="c-undo">Cancel the visit request</button></div>';
      on("c-top", back);
      on("c-undo", function () { state.chaplain = false; morning(back); });
      tag("Continuation", "The night opens a daytime conversation, when you have the energy for one.");
      return;
    }
    view.innerHTML =
      '<button class="back" type="button" id="c-top">\u2190 Back</button>' +
      '<span class="tiny">Chaplain</span><h2>Want a chaplain to visit in the morning?</h2>' +
      '<p class="sub">Only the room number from your card is shared: Room 412. Chaplains are here for people of any faith, or none.</p>' +
      '<div class="btns"><button class="btn primary" type="button" id="c-yes">Yes, this morning</button><button class="btn" type="button" id="c-no">Not now</button></div>';
    on("c-top", back);
    on("c-yes", function () { state.chaplain = true; morning(back); });
    on("c-no", back);
    tag("Continuation", "A morning visit request. You confirm before anything is sent.");
  }

  function talkNow() {
    if (state.hereName !== "morning" && state.hereName !== "talk") state.talkBack = state.here;
    var back = state.talkBack || open;
    hush();
    mark(talkNow, "talk");
    view.innerHTML =
      '<button class="back" type="button" id="n-back">← Back</button>' +
      '<span class="tiny">Talk to someone now</span>' +
      '<h2>The on-call chaplain is available all night.</h2>' +
      '<div class="card"><span class="ref">Spiritual care line</span><p style="font:500 1.2rem/1.3 var(--mono);user-select:all">Ext. 4-7729</p><p class="sub">Sample number for the prototype. Dial from the room phone, or ask your nurse.</p></div>' +
      '<button class="btn" type="button" id="n-morning">Or ask for a visit this morning</button>';
    on("n-back", back);
    on("n-morning", function () { morning(talkNow); });
    tag("Response", "A person is always one tap away. If it's too much to bear alone, a person is better than an app.");
  }

  document.getElementById("chap-link").addEventListener("click", talkNow);

  // Info menu: the design thinking behind Night Watch, one topic at a time.
  var INFO = [
    { id: "empathy", title: "Empathy map", blurb: "You, in the recliner chair at 3:12 a.m.: what you think, feel, do, and need." },
    { id: "goal", title: "The end goal", blurb: "What Night Watch is for, and what success looks like." },
    { id: "competition", title: "The competition", blurb: "Why scrolling wins at 3 a.m., and how Night Watch reaches you first." },
    { id: "answers", title: "How Night Watch works", blurb: "Who it serves, how you meet Scripture, what you can do, what comes next, and how it’s being tested." },
    { id: "guardrails", title: "Safeguards", blurb: "Six things Night Watch is designed never to do." },
    { id: "stack", title: "Platform", blurb: "The Scripture layer, where it lives, and how it connects you to people." },
    { id: "about", title: "About this prototype", blurb: "Scripture copyright, who wrote the prayers, and what's simulated." }
  ];
  var info = document.getElementById("info"), infoBody = document.getElementById("info-body");
  var infoBtn = document.getElementById("info-btn"), infoBack = document.getElementById("info-back"), infoTitle = document.getElementById("info-title");
  function infoMenu() {
    infoBack.hidden = true;
    infoTitle.textContent = "About Night Watch";
    infoBody.innerHTML = '<div class="info-menu"><h2>What would you like to read?</h2>' + INFO.map(function (x) {
      return '<button class="info-item" type="button" data-info="' + x.id + '"><strong>' + x.title + '</strong><span>' + x.blurb + '</span><i aria-hidden="true">›</i></button>';
    }).join("") + '</div>';
    infoBody.scrollTop = 0;
    infoBody.querySelectorAll("[data-info]").forEach(function (b) {
      b.addEventListener("click", function () { infoTopic(b.getAttribute("data-info")); });
    });
    var first = infoBody.querySelector(".info-item"); if (first) first.focus();
  }
  function infoTopic(id) {
    var t = document.getElementById("info-" + id), x = INFO.filter(function (i) { return i.id === id; })[0];
    infoBody.innerHTML = "";
    infoBody.appendChild(t.content.cloneNode(true));
    infoBack.hidden = false;
    infoTitle.textContent = x.title;
    infoBody.scrollTop = 0;
    infoBack.focus();
  }
  function infoOpen() {
    try { if (window.speechSynthesis) window.speechSynthesis.pause(); } catch (e) {}
    info.hidden = false;
    screen.classList.add("info-open");
    infoBtn.setAttribute("aria-expanded", "true");
    infoMenu();
  }
  function infoClose() {
    info.hidden = true;
    screen.classList.remove("info-open");
    infoBtn.setAttribute("aria-expanded", "false");
    try { if (window.speechSynthesis) window.speechSynthesis.resume(); } catch (e) {}
    infoBtn.focus();
  }
  infoBtn.addEventListener("click", function () { info.hidden ? infoOpen() : infoClose(); });
  document.getElementById("info-close").addEventListener("click", infoClose);
  infoBack.addEventListener("click", infoMenu);
  info.addEventListener("keydown", function (e) { if (e.key === "Escape") infoClose(); });

  var mins = 12;
  setInterval(function () { mins = (mins + 1) % 60; document.getElementById("clock").textContent = "3:" + (mins < 10 ? "0" : "") + mins; }, 60000);

  applyEnv();
  open();
})();
</script>
</body>
</html>
