<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Night Watch: a Psalm and a prayer for when you are awake in the hospital at night. Prototype for review.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E141C">
<title>Night Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Kanit:wght@400;500&display=swap">
<style>
/* Layout: deliberately one dark look, a hospital room at 3 a.m. The working phone prototype is the hero; the thinking behind it follows as a reading column with a few diagrams. */
:root {
  --night: #0E141C;
  --night-2: #151E29;
  --panel: #1B2633;
  --line: #2A3747;
  --text: #E6E9EE;
  --dim: #9AA6B5;
  --lamp: #E8B872;
  --lamp-soft: #2B2519;
  --lamp-line: #4A3D26;
  --calm: #8FB8C9;
  --scroll: #C97B8A;
  --scripture: "Newsreader", "Iowan Old Style", Georgia, serif;
  --ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--night);
  color: var(--text);
  font: 400 1.0625rem/1.6 var(--ui);
  padding-inline: 16px;
  padding-block: 0 4rem;
}
h1, h2, h3 { font-family: var(--scripture); font-weight: 500; margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.label {
  font: 500 0.72rem/1 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--lamp);
}
.wrap { max-width: 68rem; margin: 0 auto; }
.prose { max-width: 42rem; }
.muted { color: var(--dim); }
.hypo {
  display: inline-flex; gap: 0.5rem; align-items: center;
  font-size: 0.85rem; color: var(--dim);
  border: 1px dashed var(--line); border-radius: 6px; padding: 0.45rem 0.7rem;
  justify-self: start;
}
.hypo::before { content: "?"; font: 700 0.7rem/1 var(--mono); width: 1.1rem; height: 1.1rem; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--dim); flex: none; }

/* Hero */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 22rem);
  justify-content: center;
  padding-block: 2.5rem;
}
.hero-text { display: grid; gap: 1.25rem; padding-top: 1rem; }
.hero h1 { font-family: "Kanit", sans-serif; font-weight: 500; font-size: clamp(2.1rem, 5.6vw, 3.35rem); letter-spacing: -0.01em; }
.hero .pitch { font-family: var(--scripture); font-size: clamp(1.2rem, 2.4vw, 1.45rem); line-height: 1.5; }
.goalline { border-left: 2px solid var(--lamp); padding-left: 1rem; display: grid; gap: 0.3rem; }
.goalline p { font-size: 1.02rem; }
.facts { display: flex; flex-wrap: wrap; gap: 0.5rem; list-style: none; padding: 0; margin: 0; }
.facts li { font-size: 0.85rem; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 0.3rem 0.75rem; }
.legend { font-size: 0.85rem; color: var(--dim); }
.legend b { color: var(--lamp); font-weight: 700; }

/* Phone */
.phone {
  background: #05080C;
  border: 1px solid var(--line);
  border-radius: 34px;
  padding: 0.6rem;
  box-shadow: 0 30px 80px -30px rgba(232, 184, 114, 0.16);
  max-width: 100%;
}
.screen {
  background: #0A0F15;
  border-radius: 27px;
  height: 38rem;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
  position: relative;
  transition: filter 2s ease;
  filter: brightness(var(--bright, 1));
}
.screen.dimmed { filter: brightness(calc(var(--bright, 1) * 0.45)); }
.statusbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.85rem 1.3rem 0.5rem;
  font: 500 0.72rem/1 var(--mono);
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.view { padding: 1rem 1.25rem; display: grid; gap: 1rem; align-content: start; overflow-y: auto; }
/* Centered screens: centered when there's room, scrollable from the top when there isn't (grid centering would cut off the top). */
/* The back button stays at the top of the screen while the content below it scrolls. */
.view > .back:first-child { position: sticky; top: 0; z-index: 2; justify-self: stretch; text-align: left; margin-top: -1rem; padding-block: 1rem 0.6rem; background: #0A0F15; box-shadow: 0 -1rem 0 0 #0A0F15; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 0.25rem; }
/* Pinned: the screen's actions stay at the bottom while the content above scrolls. */
.view.pinned { display: flex; flex-direction: column; padding-bottom: 0; }
.view.pinned > .back { align-self: stretch; }
.dock { margin-top: auto; position: sticky; bottom: 0; display: grid; gap: 0.6rem; padding-block: 1rem; background: #0A0F15; box-shadow: 0 -1.25rem 1.25rem -0.25rem #0A0F15; }
.view.center { display: flex; flex-direction: column; }
.view.center > :first-child { margin-top: auto; }
.view.center > :last-child { margin-bottom: auto; }
.view.center > .back { align-self: stretch; }
.view.center > .back:first-child { margin-top: -1rem; }
.view.center > .back:first-child + * { margin-top: auto; }
.footerbar {
  padding: 0.6rem 1.25rem 1rem;
  display: flex; justify-content: space-between; gap: 0.75rem; align-items: center;
  font-size: 0.78rem; color: var(--dim);
}
.linkbtn { background: none; border: 0; padding: 0; color: var(--calm); cursor: pointer; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; }
.view h2 { font-size: 1.6rem; }
.choice.picked { border-color: var(--lamp); }
.view h2.kanit { font-family: "Kanit", sans-serif; font-size: 1.4rem; }
.view .sub { color: var(--dim); font-size: 0.95rem; }
.passage { font-family: var(--scripture); font-size: 1.3rem; line-height: 1.5; }
.sc { font-variant: small-caps; }
.ref { font: 500 0.72rem/1 var(--mono); color: var(--lamp); letter-spacing: 0.06em; }
.tiny { font: 500 0.62rem/1.35 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.btns { display: grid; gap: 0.55rem; }
.btn {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 0.65rem 1rem; cursor: pointer; font-size: 1rem; text-align: center;
}
.btn:hover { border-color: var(--lamp); }
.btn.primary { background: var(--lamp); color: #1A1306; border-color: var(--lamp); font-weight: 700; font-size: 1.1rem; padding: 0.82rem 1rem; }
.btn.quiet { background: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
.choice {
  text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 0.65rem 1rem; cursor: pointer; font-size: 1rem;
}
.choice:hover { border-color: var(--lamp); }
.back { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 0; font-size: 0.88rem; justify-self: start; }
.back:hover { color: var(--text); }
.phrase { font-family: var(--scripture); font-size: 1.75rem; line-height: 1.4; min-height: 12rem; display: flex; flex-direction: column; transition: opacity 0.6s ease; }
/* Label-to-text space: about 85% of what plain centering gave (0.85rem gap, then 7/16 of the slack above the text). */
#p-label + .phrase { margin-top: -0.15rem; }
.phrase::before { content: ""; flex: 7; }
.phrase::after { content: ""; flex: 9; }
.phrase.full::before, .phrase.full::after { display: none; }
.phrase.fade { opacity: 0; }
.dots { display: flex; gap: 0.35rem; flex-wrap: wrap; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--lamp); }
.prayer { font-family: var(--scripture); font-size: 1.35rem; line-height: 1.55; display: grid; gap: 0.35rem; }
.mine { width: 100%; min-height: 8rem; resize: vertical; background: var(--night); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 0.8rem 0.9rem; font: 400 1.1rem/1.5 var(--scripture); }
.mine::placeholder { color: var(--dim); }
.saved { display: grid; gap: 0.5rem; }
.saved-item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.7rem 0.85rem; display: grid; gap: 0.35rem; }
.saved-item p { font-family: var(--scripture); font-size: 1rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.saved-item .meta { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.saved-item .del { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 0.8rem; text-decoration: underline; padding: 0; }
.field { display: grid; gap: 0.35rem; font-size: 0.88rem; color: var(--dim); }
.field input { background: var(--night); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 0.75rem 0.85rem; font: 400 1rem/1.2 var(--ui); width: 100%; }
.field input:focus { border-color: var(--lamp); outline: none; }
.err { color: var(--scroll); font-size: 0.85rem; min-height: 1.1em; }
.or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.75rem; align-items: center; color: var(--dim); font: 500 0.66rem/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.or::before, .or::after { content: ""; height: 1px; background: var(--line); }
.danger { color: var(--scroll); border-color: #5A2F37; }
.home { display: grid; gap: 0.8rem; justify-items: center; text-align: center; padding-block: 0.75rem 1rem; }
.home-mark { width: 2.4rem; height: 2.4rem; flex: none; border-radius: 50%; box-shadow: inset -0.7rem -0.25rem 0 0 var(--lamp); transform: rotate(-20deg); margin-bottom: 0.6rem; }
.home-title { font-family: "Kanit", sans-serif; font-weight: 500; font-size: 2.15rem; line-height: 1; letter-spacing: -0.01em; }
.home-desc { color: var(--dim); font-size: 1rem; line-height: 1.5; max-width: 16rem; }
.scale10 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.4rem; }
.scale10 button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.55rem 0; cursor: pointer; font: 500 1.05rem/1 var(--mono); font-variant-numeric: tabular-nums; }
.scale10 button:hover { border-color: var(--lamp); color: var(--lamp); }
.scale-ends { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--dim); }
.pnav { display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem 1rem; display: grid; gap: 0.4rem; }
.card p { font-size: 0.93rem; }
/* "I don't have words": one verse, then a breath to follow. Nothing to choose. */
.words { display: grid; gap: 0.5rem; justify-items: center; text-align: center; }
.words-verse { font-family: var(--scripture); font-size: 1.15rem; line-height: 1.5; color: var(--dim); max-width: 17rem; }
.breath { width: 8.5rem; height: 8.5rem; border-radius: 50%; margin: 1.75rem 0 1.25rem; background: radial-gradient(circle, rgba(232,184,114,0.32), rgba(232,184,114,0.06) 70%); border: 1px solid rgba(232,184,114,0.35); animation: breathe 10s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(0.62); } 40% { transform: scale(1); } }
.breath-line { font-family: var(--scripture); font-size: 1.5rem; line-height: 1.35; min-height: 4.1rem; transition: opacity 0.8s ease; }
.breath-line.fade { opacity: 0; }
.nowords { font-size: 1rem; }
@media (prefers-reduced-motion: reduce) { .breath { animation: none; transform: scale(0.85); } .breath-line { transition: none; } }
.restline { font-family: "Kanit", sans-serif; font-weight: 400; font-size: 1.65rem; line-height: 1.3; text-align: center; }
.restsub { text-align: center; color: var(--dim); font-size: 0.95rem; }
.presets { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.preset { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0.38rem 0.8rem; cursor: pointer; font-size: 0.88rem; }
.preset[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
.timefield { display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; color: var(--dim); }
.timefield input { background: var(--night); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem 0.6rem; font: 500 1rem/1 var(--mono); }
.check { display: flex; gap: 0.6rem; align-items: flex-start; font-size: 0.9rem; cursor: pointer; }
.check input { accent-color: var(--lamp); width: 1.05rem; height: 1.05rem; margin-top: 0.15rem; flex: none; }
.lock { background: rgba(230, 233, 238, 0.07); border: 1px solid var(--line); border-radius: 16px; padding: 0.75rem 0.85rem; display: grid; gap: 0.2rem; }
.lock .top { display: flex; justify-content: space-between; font: 500 0.66rem/1 var(--mono); letter-spacing: 0.06em; color: var(--dim); text-transform: uppercase; }
.lock p { font-size: 0.9rem; }
.pill { font: 500 0.66rem/1 var(--mono); letter-spacing: 0.06em; color: var(--lamp); border: 1px solid var(--lamp-line); border-radius: 999px; padding: 0.3rem 0.55rem; justify-self: start; }
.annot { margin-top: 0.9rem; font-size: 0.85rem; color: var(--dim); display: flex; gap: 0.5rem; align-items: baseline; min-height: 3.2rem; }
.annot .tag { font: 500 0.68rem/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--night); background: var(--lamp); padding: 0.25rem 0.4rem; border-radius: 3px; flex: none; }

/* Sections */
section { border-top: 1px solid var(--line); padding-block: 3rem; display: grid; gap: 1.25rem; }
section > h2 { font-size: clamp(1.6rem, 3.6vw, 2.1rem); }
h3.sub-h { font-size: 1.3rem; margin-top: 1rem; }

/* Empathy map */
.emap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas: "thinks feels" "persona persona" "does hears";
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.quad { background: var(--night); padding: 1.2rem 1.3rem; display: grid; gap: 0.6rem; align-content: start; min-width: 0; }
.quad ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; }
.quad li { font-family: var(--scripture); font-size: 1.08rem; line-height: 1.4; }
.quad li.plain { font-family: var(--ui); font-size: 0.97rem; color: var(--text); }
.persona { grid-area: persona; background: var(--night-2); padding: 1.1rem 1.3rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1rem; align-items: center; }
.persona .clock { font: 500 1.6rem/1 var(--mono); color: var(--lamp); font-variant-numeric: tabular-nums; }
.persona p { color: var(--dim); font-size: 0.97rem; }
.persona strong { color: var(--text); }

/* Capacity scales (phone check-in) */
.cells { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.cells button { height: 1.15rem; border: 0; padding: 0; border-radius: 3px; background: var(--line); cursor: pointer; }
.cells button:hover { background: var(--lamp-line); }
.cells button.on { background: var(--lamp); }
.resetbtn { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 0.5rem 0.8rem; cursor: pointer; font-size: 0.88rem; }
.resetbtn:hover { color: var(--text); border-color: var(--dim); }
.adj { display: grid; gap: 0.85rem; }
.adj-row { display: grid; gap: 0.35rem; }
.adj-row .top { display: flex; justify-content: space-between; font-size: 0.88rem; }
.adj-row .top span:last-child { color: var(--dim); font: 500 0.7rem/1.4 var(--mono); }
.adj-row .cells button { height: 1.5rem; border-radius: 6px; }
.phrase.full { font-size: 1.25rem; line-height: 1.5; min-height: 12rem; display: block; }
.phrase.full > span { opacity: 0.35; transition: opacity 0.5s ease; }
.phrase.full > span.cur { opacity: 1; }

/* Needs */
.needs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; }
.need { border-top: 2px solid var(--calm); padding-top: 0.75rem; display: grid; gap: 0.5rem; align-content: start; min-width: 0; }
.need h3 { font-family: var(--ui); font-weight: 700; font-size: 1rem; }
.need ul { margin: 0; padding-left: 1rem; display: grid; gap: 0.3rem; font-size: 0.93rem; color: var(--dim); }
.need.spirit { border-top-color: var(--lamp); }

/* Goal ladder */
.ladder { display: grid; gap: 0.6rem; }
.rung { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 7rem) minmax(0, 1fr); gap: 1.25rem; align-items: start; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--night-2); }
.rung.goal { border-color: var(--lamp); background: var(--lamp-soft); }
.rung .q { font-family: var(--scripture); font-size: 1.15rem; }
.verdict { font: 500 0.66rem/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 0.3rem 0.45rem; border-radius: 4px; justify-self: start; border: 1px solid var(--line); color: var(--dim); }
.verdict.goal { background: var(--lamp); color: #1A1306; border-color: var(--lamp); }
.verdict.main { color: var(--lamp); border-color: var(--lamp-line); }
.verdict.cut { color: var(--scroll); border-color: #5A2F37; text-decoration: line-through; }
.rung p { color: var(--dim); font-size: 0.95rem; }
.success { display: grid; gap: 0.4rem; padding: 1.2rem 1.3rem; border: 1px solid var(--lamp-line); border-radius: 10px; }
.success p.big { font-family: var(--scripture); font-size: 1.35rem; line-height: 1.4; }

/* Competition table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 40rem; font-size: 0.95rem; }
th, td { text-align: left; padding: 0.8rem 0.95rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 0.68rem/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); background: var(--night-2); }
th.scroll { color: var(--scroll); }
th.nw { color: var(--lamp); }
tr:last-child td { border-bottom: 0; }
td:first-child { color: var(--dim); width: 22%; }
td.pending { color: var(--dim); font-style: italic; }

/* Path to the tool */
.path { display: grid; gap: 0; position: relative; }
.stop { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 1.25rem; padding-block: 1rem; border-top: 1px solid var(--line); }
.stop:first-child { border-top: 0; }
.stop time { font: 500 0.95rem/1.3 var(--mono); color: var(--lamp); font-variant-numeric: tabular-nums; }
.stop h3 { font-family: var(--ui); font-weight: 700; font-size: 1.02rem; margin-bottom: 0.3rem; }
.stop p { color: var(--dim); font-size: 0.95rem; max-width: 40rem; }
.cardmock {
  border: 1px solid var(--lamp-line); background: var(--lamp-soft); border-radius: 10px;
  padding: 1.1rem 1.2rem; display: grid; grid-template-columns: minmax(0, 1fr) 4.5rem; gap: 1rem; align-items: center; max-width: 30rem;
}
.cardmock p.head { font-family: var(--scripture); font-size: 1.25rem; line-height: 1.3; }
.cardmock p.small { font-size: 0.85rem; color: var(--dim); margin-top: 0.35rem; }
.qr { width: 4.5rem; height: 4.5rem; border-radius: 6px; background:
  conic-gradient(from 0deg, var(--text) 0 25%, transparent 0 50%, var(--text) 0 75%, transparent 0) 0 0 / 0.9rem 0.9rem;
  opacity: 0.85; border: 4px solid var(--text); }
.nots { display: grid; gap: 0.4rem; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 10px; }
.nots ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.3rem; color: var(--dim); font-size: 0.95rem; }

/* Five answers */
.answers { display: grid; gap: 0; }
.answer { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 2rem; padding-block: 1.5rem; border-top: 1px solid var(--line); }
.answer:first-child { border-top: 0; padding-top: 0.5rem; }
.answer-head { display: grid; gap: 0.5rem; align-content: start; }
.answer-head h3 { font-size: 1.45rem; }
.answer-head .num { font: 500 0.75rem/1 var(--mono); color: var(--dim); letter-spacing: 0.08em; }
.answer-body { display: grid; gap: 0.75rem; max-width: 40rem; }
.answer-body ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.35rem; }
.callout { border: 1px solid var(--lamp-line); background: var(--lamp-soft); border-radius: 8px; padding: 0.9rem 1rem; display: grid; gap: 0.35rem; }
.callout b { font: 500 0.68rem/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--lamp); }

/* Guardrails + stack */
.guards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.guard { background: var(--night); padding: 1.1rem 1.2rem; display: grid; gap: 0.4rem; align-content: start; }
.guard h3 { font-family: var(--ui); font-weight: 700; font-size: 0.98rem; }
.guard p { color: var(--dim); font-size: 0.93rem; }
.stack { display: grid; gap: 0.6rem; }

<div class="wrap">
  <div class="hero">
    <div>
      <div class="phone" role="region" aria-label="Night Watch prototype on a family member's phone">
        <div class="screen" id="screen">
          <div class="statusbar"><span id="clock">3:12</span><span class="sb-right"><span>18% ▮</span><button class="infobtn" id="info-btn" type="button" aria-label="About Night Watch" aria-expanded="false" aria-controls="info">i</button></span></div>
          <div class="view" id="view" aria-live="polite"></div>
          <div class="info" id="info" hidden role="dialog" aria-label="About Night Watch">
            <div class="info-top"><button class="back" type="button" id="info-back" hidden>← All topics</button><span class="tiny" id="info-title">About Night Watch</span><button class="infoclose" type="button" id="info-close" aria-label="Close">×</button></div>
            <div class="info-body" id="info-body"></div>
          </div>
          <div class="footerbar">
            <span>Medical help: your nurse call button</span>
            <button class="linkbtn" id="chap-link" type="button">Talk to someone</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <template id="info-about">
  <div class="info-doc">
    <span class="label">About this prototype</span>
    <h2>Credits and notes</h2>
    <div class="about">
    <p>Scripture quotations are taken from The Holy Bible, New International Version® NIV®. Copyright © 1973, 1978, 1984, 2011 by Biblica, Inc.™ Used by permission. All rights reserved worldwide.</p>
    <p>Prayers and introduction lines are written by the Night Watch team and are not Scripture.</p>
    <p>The prototype voice is your device's built-in speech, used as a stand-in for recorded audio. The clock, battery, room, and phone line are simulated, and nothing is sent anywhere.</p>
    </div>
  </div>
  </template>
  <template id="info-empathy">
  <div class="info-doc">
    <span class="label">Empathy map</span>
    <h2>You, in the recliner chair, 3:12 a.m.</h2>
    <p class="prose muted">Night Watch is for you if you're staying overnight while someone you love is a patient: a spouse, an adult child, a parent. You're not the patient, and you have no role in the room except to be there.</p>
    <span class="hypo">Team's working hypothesis. Every line here gets tested in the interviews listed under Validation, in How Night Watch works.</span>

    <div class="emap">
      <div class="quad" style="grid-area: thinks;">
        <span class="label">You think</span>
        <ul>
          <li>"What if they get worse while I'm asleep?"</li>
          <li>"Did I understand what the doctor said? Should I have asked more?"</li>
          <li>"I need to sleep. Why can't I sleep?"</li>
          <li>"I don't even know what to pray anymore."</li>
        </ul>
      </div>
      <div class="quad" style="grid-area: feels;">
        <span class="label">You feel</span>
        <ul>
          <li class="plain">Fear that has nowhere to go</li>
          <li class="plain">Helplessness, because there is nothing to fix and nothing to do</li>
          <li class="plain">Alone, even with the patient a few feet away</li>
          <li class="plain">Bone-tired, but wired</li>
          <li class="plain">Guilt for scrolling, for being tired, for wanting to go home</li>
        </ul>
      </div>
      <div class="persona">
        <span class="clock">3:12</span>
        <p><strong>You've been awake about an hour.</strong> Your phone is at 18%. The patient is finally asleep, so you won't turn on a light or make noise. The next vitals check is around 4 a.m.</p>
      </div>
      <div class="quad" style="grid-area: does;">
        <span class="label">You do</span>
        <ul>
          <li class="plain">You scroll social feeds and short videos with the sound off</li>
          <li class="plain">You search symptoms and reread results in the patient portal</li>
          <li class="plain">You type updates to the family group chat, then don't send them</li>
          <li class="plain">You watch the numbers on the monitor</li>
        </ul>
      </div>
      <div class="quad" style="grid-area: hears;">
        <span class="label">You hear &amp; see</span>
        <ul>
          <li class="plain">Monitor beeps and IV pump alarms</li>
          <li class="plain">Footsteps and voices at the nurses' station</li>
          <li class="plain">A dark room lit by the phone and the monitor</li>
          <li class="plain">The patient's breathing, which you keep listening for</li>
        </ul>
      </div>
    </div>

    <h3 class="sub-h">What you need most</h3>
    <div class="needs">
      <div class="need">
        <h3>Emotionally</h3>
        <ul><li>To not be alone with it</li><li>Something to do with the helplessness</li><li>Permission to stop holding it together</li></ul>
      </div>
      <div class="need spirit">
        <h3>Spiritually</h3>
        <ul><li>Words to pray when you have none</li><li>A sense that God is present in this room</li><li>A way to put the person you love in God's hands</li></ul>
      </div>
      <div class="need">
        <h3>Physically</h3>
        <ul><li>A body that slows down enough to rest</li><li>Less light and stimulation, not more</li></ul>
      </div>
      <div class="need">
        <h3>Relationally</h3>
        <ul><li>A person to talk to, if it gets to be too much</li><li>Not to wake the patient or bother the nurse</li></ul>
      </div>
    </div>
  </div>
  </template>
  <template id="info-goal">
  <div class="info-doc">
    <span class="label">The end goal</span>
    <h2>Comfort in God is the goal. Prayer is how you get there.</h2>
    <p class="prose muted">The reviewer asked which of these is the point. We ranked them against the empathy map. Each one either serves the goal or gets cut.</p>
    <div class="ladder">
      <div class="rung goal"><span class="q">For you to feel comforted in God</span><span class="verdict goal">The goal</span><p>This is what you lack most at 3 a.m. and what scrolling can't give. Rest, and sometimes sleep, is how it shows.</p></div>
      <div class="rung"><span class="q">For you to have the words to pray</span><span class="verdict main">The main action</span><p>The bridge from Scripture to comfort. After the Psalm, they get a short prayer built from its own words, which you can whisper or simply listen to. It also gives the helpless feeling something to do: pray for the person you love.</p></div>
      <div class="rung"><span class="q">For you to read the passage</span><span class="verdict">The means</span><p>Scripture is what makes it comforting and not just calming, so it can't be skipped. But at reading energy near zero, you hear it more than read it.</p></div>
      <div class="rung"><span class="q">For you to write a reflection</span><span class="verdict cut">Cut</span><p>A required reflection takes energy you don't have and turns comfort into a task, so it's cut. If you do want to put your own words to God, you can write a prayer. It's optional and stays on your phone.</p></div>
    </div>
    <div class="success">
      <span class="label">What success looks like</span>
      <p class="big">The session ends with your phone face-down, and you feel a little less alone.</p>
      <p class="muted">Success is not time in the app, a return visit, or a finished passage. Night Watch asks how you feel after the passage, but only so it can respond to you. The answer isn't saved, sent, or counted. We learn it by asking families and chaplains.</p>
    </div>
  </div>
  </template>
  <template id="info-competition">
  <div class="info-doc">
    <span class="label">The competition</span>
    <h2>Mindless scrolling is already in your hand</h2>
    <p class="prose">Scrolling wins at 3 a.m. because it costs nothing. It needs no decisions, no energy, and no feelings, and it never ends. Night Watch can't out-entertain it and shouldn't try. It competes on two things: being almost as easy to start, and giving what scrolling can't, which is relief and an ending.</p>
    <div class="tablewrap">
      <table>
        <thead><tr><th></th><th class="scroll">Scrolling</th><th class="nw">Night Watch</th></tr></thead>
        <tbody>
          <tr><td>To start</td><td>Already open</td><td>One tap on the home-screen icon, then a quick check-in already set to the lowest settings, and an optional "What's weighing on you?" Two more taps and the Psalm starts.</td></tr>
          <tr><td>First five seconds</td><td>Something new and loud</td><td>A dark screen asking how much you have right now</td></tr>
          <tr><td>What it asks of you</td><td>Nothing</td><td>Almost nothing: listen, then say amen</td></tr>
          <tr><td>Length</td><td>No end</td><td>About two minutes, with a real end</td></tr>
          <tr><td>How it ends</td><td>When the battery dies or the sky gets light</td><td>With permission to put the phone down</td></tr>
          <tr><td>How you feel after</td><td>More wired, same fear</td><td class="pending">Hoped: less alone, calmer. To be tested.</td></tr>
        </tbody>
      </table>
    </div>

    <h3 class="sub-h">Getting you to the tool</h3>
    <p class="prose muted">At 3 a.m., no one will go looking for a new tool. The decision has to be made earlier in the evening, while you still have energy, and the tool has to be one tap from where your thumb already is.</p>
    <div class="path">
      <div class="stop"><time>8:00 pm</time><div><h3>A person invites you</h3><p>On the evening round, a chaplain or nurse leaves a small card by the recliner chair and says one sentence: "If you're up tonight, this is for you." A human invitation, made while you can still take it in.</p></div></div>
      <div class="stop"><time>8:02 pm</time><div><h3>One-time setup on your phone</h3><p>Scanning the card opens Night Watch and offers to add it to the home screen, next to the apps you'd scroll. If you want, you can also pick one time a day for a quiet reminder that the day's passage is ready. You can try the short check-in that opens Night Watch each time, so it's familiar at 3 a.m. This is also when you sign in, or choose a guest account, so there's nothing to do at 3 a.m. That's the only setup. The card's code already carries the unit and room.</p></div></div>
      <div class="stop"><time>2:40 am</time><div><h3>The card speaks to the scroll moment</h3><p>The card's words are written for the moment you notice you've been scrolling and feel worse. It's printed with glow-in-the-dark ink so it can be seen in the dark room without a light.</p>
        <div class="cardmock" style="margin-top:0.85rem;">
          <div><p class="head">Been scrolling a while?<br>Try two minutes of this instead.</p><p class="small">A Psalm read softly, a prayer, then rest. Sign in or continue as a guest. Scan or tap the Night Watch icon.</p></div>
          <span class="qr" aria-hidden="true"></span>
        </div>
      </div></div>
      <div class="stop"><time>3:12 am</time><div><h3>Two taps, and the Psalm is playing</h3><p>Night Watch opens on a quick check-in: how much thinking, reading, writing, attention, and sound and light you have right now. It's already set to the lowest settings, so if you can't decide, you just tap Next. Then it asks what's weighing on you: worry, fear, waiting, exhaustion, anger at God, numbness, or loss. One tap picks a passage that speaks to it, or you skip it and tap Begin. The check-in sets the length of the passage and the prayer. If even that is too much, "I don't have words" on the first screen skips everything: Romans 8:26, then a slow breath with "Be still, and know that I am God."</p></div></div>
      <div class="stop"><time>4:00 am</time><div><h3>The vitals round reinforces it</h3><p>If the night nurse sees you awake, they can point you to the card. That's a few words in a visit that already happens, not a new task.</p></div></div>
    </div>
    <div class="nots">
      <span class="label">What we won't do to win</span>
      <ul>
        <li>No notifications unless you ask for one. If you do, you pick the time, it's one a day, and it arrives silently by default. It never nags, repeats, or counts streaks.</li>
        <li>No streaks, autoplay into more content, or "one more" prompts by default.</li>
        <li>No blocking or interrupting other apps.</li>
      </ul>
    </div>
  </div>
  </template>
  <template id="info-answers">
  <div class="info-doc">
    <span class="label">How Night Watch works</span>
    <h2>From the need to the next step</h2>
    <div class="answers">
      <article class="answer">
        <div class="answer-head"><span class="num">1</span><h3>Need</h3></div>
        <div class="answer-body">
          <p>Night Watch serves you, the family member staying overnight with a loved one in the hospital. Overnight, you face fear and helplessness with almost no capacity left, few people around, and a phone full of easier distractions. Bible apps ask you to search, choose, and read at exactly the moment you can't. See the empathy map.</p>
        </div>
      </article>
      <article class="answer">
        <div class="answer-head"><span class="num">2</span><h3>Encounter</h3></div>
        <div class="answer-body">
          <p>A home-screen web page on your own phone, set up from a room card. It opens on a quick check-in, already set low, asks what's weighing on you, then plays a passage chosen and paced to match your answers.</p>
          <div class="callout"><b>The removal test</b><p>Take Scripture out and nothing is left. There's no feed or wellness tool underneath. The experience is a Psalm, a prayer drawn from it, and rest.</p></div>
        </div>
      </article>
      <article class="answer">
        <div class="answer-head"><span class="num">3</span><h3>Response</h3></div>
        <div class="answer-body">
          <ul>
            <li><strong>Pray:</strong> a short prayer built from the passage's own words, labeled as written by the team. You can whisper it, or listen and say amen.</li>
            <li><strong>Write your own prayer, if you want to:</strong> start from a blank page or from the team's prayer. It's saved only on your phone and never sent.</li>
            <li><strong>Say how you feel, if you want to:</strong> after the passage, a 1 to 10 check-in. If you're struggling, Night Watch offers a person to talk to before the prayer. The answer isn't saved or sent.</li>
            <li><strong>Rest:</strong> the screen dims and the session ends.</li>
            <li><strong>Reach a person:</strong> the spiritual-care line now, or a chaplain visit in the morning.</li>
          </ul>
        </div>
      </article>
      <article class="answer">
        <div class="answer-head"><span class="num">4</span><h3>Continuation</h3></div>
        <div class="answer-body">
          <ul>
            <li><strong>Tomorrow night:</strong> the next Psalm in a short path. It's tracked by date. With an account, it follows you to any phone. As a guest, it stays on this one.</li>
            <li><strong>An account, if you want one:</strong> your reading path, reminder, and settings follow you home after discharge. A guest account works the same way, on this phone only.</li>
            <li><strong>A daily reminder, only if you want one:</strong> you pick the time, and one quiet notification says the day's passage is ready. You can change or turn it off from the same screen.</li>
            <li><strong>In the morning:</strong> "Let a chaplain know I was up" asks for a daytime visit. Daytime is when you have the energy for a real conversation.</li>
            <li><strong>After discharge:</strong> the same Psalms as a YouVersion reading plan, and a local congregation's care team only if you ask the chaplain.</li>
          </ul>
        </div>
      </article>
      <article class="answer">
        <div class="answer-head"><span class="num">5</span><h3>Validation</h3></div>
        <div class="answer-body">
          <p>We've had one round of reviewer feedback, which shaped the empathy map, the goal, and the path to the tool. We haven't talked with families or chaplains yet. The table lists who we'll learn from and the assumptions most likely to be wrong. The last two columns are filled only with what we actually hear.</p>
        </div>
      </article>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Assumption to test</th><th>Learn from</th><th>What we heard</th><th>What changed</th></tr></thead>
        <tbody>
          <tr><td>The empathy map is right: fear, helplessness, and near-zero capacity are what 3 a.m. feels like.</td><td>Family members who have stayed overnight, introduced by chaplains</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>Listening is easier than reading at 3 a.m.</td><td>The same families, with the prototype in hand</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>You'll save it to your home screen in the evening.</td><td>Families, during short evening tests on a unit</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>"You can put the phone down now" feels like comfort, not dismissal.</td><td>Families, chaplains</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>Nurses and chaplains will hand out the card as part of their round.</td><td>Night-shift nurses, spiritual-care directors</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>The passage-and-prayer pairings are faithful and fit each moment.</td><td>Chaplains and theological reviewers from several traditions</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>A daily reminder you set yourself feels like a kindness, not an intrusion. Evening works better than the middle of the night.</td><td>Families who try the reminder during a stay</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>Some people want to write their own prayers, even at 3 a.m., and having them saved on the phone helps on later nights.</td><td>Families, with the prototype in hand</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>"I don't have words" is found by the people who need it, and a verse plus a breath is enough to feel less alone.</td><td>Families, chaplains</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>Being asked what's weighing on you, and getting a passage that names it, makes you feel seen.</td><td>Families, with the prototype in hand</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>A check-in before the Psalm feels quick, not like a form, and matching the passage and prayer to your answers helps.</td><td>Families, with the prototype in hand</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>
          <tr><td>A 1 to 10 check-in after the passage feels like care, not a test, and a low answer is the right moment to offer a person.</td><td>Families, chaplains</td><td class="pending">Not yet tested</td><td class="pending">—</td></tr>

  <template id="info-guardrails">
  <div class="info-doc">
    <span class="label">Safeguards</span>
    <h2>Lines Night Watch won’t cross</h2>
    <div class="guards">
      <div class="guard"><h3>Scripture is the experience</h3><p>No unrelated product sits underneath. See the removal test.</p></div>
      <div class="guard"><h3>Interpretation is labeled</h3><p>Prayers and introductions are marked as written by the team. Passages are quoted whole with reference and translation, and every pairing is reviewed by chaplains.</p></div>
      <div class="guard"><h3>Built to be put down</h3><p>The design target is the phone face-down. There are no streaks or engagement metrics. The only notification is one you schedule yourself: one a day, silent by default.</p></div>
      <div class="guard"><h3>Safe for vulnerable people</h3><p>A guest account needs no email, name, diagnosis, or phone number. A full account asks only for an email and a password, and you can delete it and everything in it at any time. Prayers you write stay on your phone and can be deleted at any time. Medical needs are always routed to the call button.</p></div>
      <div class="guard"><h3>Community input first</h3><p>Nothing ships to a unit until that hospital's chaplains and family advisors have shaped it.</p></div>
      <div class="guard"><h3>Licensing respected</h3><p>The prototype quotes the NIV within Biblica's published allowance for short quotations, with its required notice. In production, NIV text and audio would be licensed through the YouVersion Platform or directly from Biblica.</p></div>
    </div>
  </div>
  </template>
  <template id="info-stack">
  <div class="info-doc">
    <span class="label">Platform</span>
    <h2>What it’s built on</h2>
    <div class="stack">
      <div class="layer core"><div><strong>YouVersion Platform</strong><span class="role">Core Scripture layer</span></div><p>Passage text and, where licensed, recorded audio in the family's language. Also hosts the reading plan after discharge.</p></div>
      <div class="layer"><div><strong>Installable web page</strong><span class="role">Where it lives</span></div><p>A home-screen web app opened from the room card's code. It needs no app store and works offline once saved. The optional daily reminder uses web push, which on iPhone works once the page is on the home screen. The server keeps only an anonymous push address and a time, and deletes both when you turn the reminder off.</p></div>
      <div class="layer"><div><strong>Accounts</strong><span class="role">Sign-in</span></div><p>Sign up with an email and password, and confirm the address from an email. Log in with the same email and password, with no email to wait for. Passwords are stored only as secure hashes. An account stores only your email, your place in the reading path, your reminder time, and your settings. A guest account stores nothing on a server. Written prayers and feelings check-ins are never stored in an account.</p></div>
      <div class="layer"><div><strong>Hospital spiritual care</strong><span class="role">Human connection</span></div><p>The night spiritual-care line, and morning visit requests routed into the hospital's existing referral workflow.</p></div>
      <div class="layer"><div><strong>Gloo</strong><span class="role">To evaluate</span></div><p>A candidate for the optional chaplain-to-congregation referral after discharge. Used only if it makes that handoff more trustworthy.</p></div>
    </div>
  </div>
